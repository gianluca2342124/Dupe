# Daily import of the authorised Awin product feed into Supabase.
# Requires repository secrets: AWIN_FEED_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# (and optionally AWIN_API_TOKEN, AWIN_ALIEXPRESS_ADVERTISER_ID). See docs/AWIN_SETUP.md.
name: Awin feed sync

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      max_rows:
        description: 'Stop after N accepted rows (empty = all)'
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ vars.AWIN_SYNC_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync:awin
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_ALIEXPRESS_ADVERTISER_ID: ${{ secrets.AWIN_ALIEXPRESS_ADVERTISER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_ROWS: ${{ inputs.max_rows }}
